name: ledgerguard

x-api-env: &api-env
  NODE_ENV: production
  API_PORT: 3333
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_MIGRATOR_URL: ${DATABASE_MIGRATOR_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  REFRESH_SECRET: ${REFRESH_SECRET}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
  CORS_ORIGIN: ${CORS_ORIGIN}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_PORT: ${MINIO_PORT}
  MINIO_USE_SSL: ${MINIO_USE_SSL}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_FROM: ${SMTP_FROM}
  SEED_INITIAL_DATA: ${SEED_INITIAL_DATA}

x-worker-env: &worker-env
  NODE_ENV: production
  WORKER_DATABASE_URL: ${WORKER_DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  WORKER_HEALTH_PORT: 3334

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports: ["9000:9000","9001:9001"]
    volumes: [minio_data:/data]
    networks: [data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025","1025:1025"]
    networks: [data]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    ports: ["3333:3333"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3333/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [app,data,monitoring]

  ingestion-worker:
    build:
      context: .
      dockerfile: apps/ingestion-worker/Dockerfile
    environment: *worker-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3334/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [data,monitoring]

  fraud-worker:
    build:
      context: .
      dockerfile: apps/fraud-worker/Dockerfile
    environment: *worker-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3334/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [data,monitoring]

  reconciliation-worker:
    build:
      context: .
      dockerfile: apps/reconciliation-worker/Dockerfile
    environment: *worker-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3334/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [data,monitoring]

  settlement-worker:
    build:
      context: .
      dockerfile: apps/settlement-worker/Dockerfile
    environment: *worker-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3334/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [data,monitoring]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3333
    environment:
      API_INTERNAL_URL: http://api:3333
      NEXT_TELEMETRY_DISABLED: 1
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [app]

  nginx:
    image: nginx:1.29-alpine
    ports: ["8080:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [app]

  prometheus:
    image: prom/prometheus:latest
    command: --config.file=/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [monitoring]

  promtail:
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [monitoring]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports: ["3001:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus,loki]
    networks: [monitoring]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  app:
  data:
  monitoring:
