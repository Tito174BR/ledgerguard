name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  containers:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d
      - run: |
          for i in {1..60}; do
            curl -fsS http://localhost:8080/health/ready && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/smoke-test.mjs
      - if: always()
        run: docker compose down -v
